name: Build and verify Mac preview
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  mac:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Download verified compiled build payload
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request,os,hashlib,zipfile,io,json
          req=urllib.request.Request('https://api.github.com/repos/creative-cmj/luma-desk/releases/assets/651263769',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/octet-stream','X-GitHub-Api-Version':'2022-11-28'})
          data=urllib.request.urlopen(req,timeout=180).read()
          assert hashlib.sha256(data).hexdigest()=='984b3c48f74dbb695d1c4649497d854b19ae5bfc8dbcf710d69cfa6aa98f251d'
          with zipfile.ZipFile(io.BytesIO(data)) as z:z.extractall('app')
          p=json.load(open('app/package.json'));p['build']['publish']=[];p['dependencies']={'zod':'4.6.7'}
          json.dump(p,open('app/package.json','w'))
          PY
      - name: Package native app and disk image
        working-directory: app
        run: npx --yes --package electron-builder@26.15.3 electron-builder --mac zip dmg --${{ matrix.arch }} --publish never
      - name: Verify bundle signature and architecture
        run: |
          APP=$(find app/release -maxdepth 2 -name 'Luma Desk.app' -print -quit)
          test -n "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          file "$APP/Contents/MacOS/Luma Desk"
          echo "APP_PATH=$PWD/$APP" >> "$GITHUB_ENV"
      - name: Install isolated verification harness
        run: |
          mkdir qa
          cd qa
          npm install --ignore-scripts --no-audit --no-fund @playwright/test@1.64.1
          python3 - <<'PY'
          import base64
          open('smoke.cjs','wb').write(base64.b64decode(''))
          PY
      - name: Run real packaged Mac app
        run: node qa/smoke.cjs "$APP_PATH/Contents/MacOS/Luma Desk" "qa/results"
      - name: Publish verified preview assets to draft release
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          python3 - <<'PY'
          import urllib.request,json,os,pathlib
          root=pathlib.Path('app/release')
          paths=list(root.glob('*.zip'))+list(root.glob('*.dmg'))
          paths+=[pathlib.Path('qa/results/native-smoke.json'),pathlib.Path('qa/results/mac-themes.png')]
          assert len(paths)==4,paths
          for p in paths:
            name=('Mac-'+os.environ['ARCH']+'-verification.json') if p.suffix=='.json' else ('Mac-'+os.environ['ARCH']+'-preview.png') if p.suffix=='.png' else p.name
            req=urllib.request.Request('https://uploads.github.com/repos/creative-cmj/luma-desk/releases/415990351/assets?name='+name,data=p.read_bytes(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Content-Type':'application/octet-stream','Accept':'application/vnd.github+json'},method='POST')
            r=json.load(urllib.request.urlopen(req,timeout=300))
            print(r['name'],r['size'])
          PY
